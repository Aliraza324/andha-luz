<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Background -->
  <rect width="64" height="64" rx="14" fill="#071914" />
  
  <!-- Moorish 8-Point Star Icon (Rub el Hizb) in Gold / Terracotta -->
  <g transform="translate(32, 32)">
    <!-- Square 1 rotated 0 -->
    <rect x="-16" y="-16" width="32" height="32" rx="2" fill="#CC5B3B" />
    <!-- Square 2 rotated 45deg -->
    <rect x="-16" y="-16" width="32" height="32" rx="2" fill="#C48A48" transform="rotate(45)" opacity="0.9" />
    <!-- Inner golden star core -->
    <circle cx="0" cy="0" r="6" fill="#FAF4EE" />
    <circle cx="0" cy="0" r="3" fill="#071914" />
  </g>
</svg>